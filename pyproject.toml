[project]
name = "oc-p05-attrition-ml-deployment"
version = "0.5.0"
description = "Deploy an employee attrition model (CatBoost) behind a FastAPI API with PostgreSQL, Docker Compose and CI/CD"
readme = "README.md"
authors = [
    { name = "Anne Delpla", email = "dapitch666@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.165.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
oc-p05-attrition-ml-deployment = "oc_p05_attrition_ml_deployment:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["oc_p05_attrition_ml_deployment"]
branch = true
