default_install_hook_types: [pre-commit, prepare-commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: commit-type-from-branch
        name: Prefix commit message with the branch type
        entry: python3 scripts/prepare_commit_msg.py
        language: system
        stages: [prepare-commit-msg]
        always_run: true
